<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogLens / 日志工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">◉ LogLens <small>LOCAL LOG WORKBENCH</small></div><span id="session">正在连接会话</span><button id="theme">切换主题</button></header>
<div class="workspace"><aside><h2>关注镜头</h2><form id="filters"><label>等级<select name="level"><option value="">全部等级</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option><option>TRACE</option></select></label><label>Logger<input name="logger" placeholder="完整 Logger 名称"></label><label>关键词<input name="q" placeholder="搜索消息"></label><label>Trace ID<input name="traceId"></label><label>订单号<input name="orderId"></label><label>标签<input name="tag"></label><button>应用筛选</button></form><p class="hint">筛选只改变当前视图。规则修改后需重启应用。</p></aside>
<main><nav><div class="tabs"><button id="logs-tab" class="tab active">日志</button><button id="connections-tab" class="tab">连接</button></div><strong id="view-title">事件流</strong><span id="connection">连接中</span><button id="captured-view" hidden>查看采集明细</button><button id="pause">暂停跟随</button><button id="next">加载下一页</button></nav><p id="notice" class="hint" hidden></p><div id="viewport" tabindex="0" aria-label="日志事件列表"><div id="spacer"></div><div id="rows"></div></div><footer id="health">等待状态</footer><div id="connections-view" hidden><div class="telemetry-summary"><article><small>当前会话</small><strong id="active-count">0</strong></article><article><small>当前入站连接</small><strong id="connection-count">0</strong></article><article><small>累计上行</small><strong id="uplink-total">0 B</strong></article><article><small>累计下行</small><strong id="downlink-total">0 B</strong></article></div><form id="telemetry-filters" class="telemetry-filters"><label>客户端<input name="peerAddress" placeholder="IP 或端口"></label><label>传输<select name="transport"><option value="">全部</option><option value="http2">HTTP/2</option><option value="http3">HTTP/3</option></select></label><label>目标<input name="target" placeholder="域名或地址"></label><label>状态<input name="status" placeholder="active / closed"></label><label>开始时间<input name="fromTime" type="datetime-local"></label><label>结束时间<input name="toTime" type="datetime-local"></label><button>应用筛选</button></form><div class="table-wrap"><table><thead><tr><th>时间</th><th>事件 / 状态</th><th>客户端</th><th>传输</th><th>Stream</th><th>目标</th><th>上行</th><th>下行</th></tr></thead><tbody id="telemetry-rows"></tbody></table></div><button id="telemetry-next">加载更早事件</button><p class="hint">流量为累计字节数；数据内容不会被采集。用户身份显示为客户端地址和 Stream。</p></div></main>
<section id="detail"><h2>记录详情</h2><p class="hint">选择日志查看完整消息、异常与命中规则。</p><button id="focus-order" hidden>关注此订单</button><pre id="content"></pre><details id="exception" hidden><summary>异常堆栈</summary><pre id="exception-content"></pre></details><button id="sources" hidden>展开重复明细</button><pre id="source-content"></pre></section></div><script src="/app.js" defer></script><script src="/telemetry.js" defer></script></body></html>
